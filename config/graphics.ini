; graphics.ini: display and rendering options of the native build (read once at start by gfx_options.c).
; Delete the file to get it written again with these defaults. A line starting with ';' is a comment.
; Every value below is the default; the defaults draw exactly what the game draws on the console.

; renderer = vulkan | opengl
;   vulkan: the default since 2026-10-09. opengl: the first renderer (NVIDIA only), kept as a fallback.
renderer = vulkan

; window = windowed | borderless | fullscreen
;   windowed:   a normal window with the client size below.
;   borderless: no frame, covers the monitor the window is on (the desktop keeps its resolution).
;   fullscreen: as borderless, and always on top. (Exclusive fullscreen with a mode change is not implemented.)
window = windowed
width = 1280
height = 720

; vsync = auto | display | clock | off | on | mailbox      (Vulkan)
;   auto:    the refresh rate of the monitor is measured at start. 60, 120, 240 Hz (within 1.1 %: 59.94, 119.88 too):
;            as 'display', and checked every 5 s: when the game's speed leaves 60 +-1.1 % (a variable refresh rate:
;            G-Sync / FreeSync), as 'clock' until the refresh is steady again. Any other rate (75, 100, 144, 165 Hz):
;            as 'clock'. The log says which ('display:' lines).
;   display: the game's frame clock IS the display's refresh (every refresh at 60 Hz, every second one at 120 Hz):
;            each frame is on screen for exactly the same time. No tearing. The game runs at refresh / k frames per
;            second (59.94 on a 119.88 Hz panel). Falls back to 'clock' when the rate is not a multiple of 60 at start;
;            keeps the lock if the refresh drifts later (the game then runs slower or faster than real time).
;   clock:   the program's own 60.000 Hz clock; a finished frame is shown at the next tick of that clock (mailbox when
;            the GPU offers it, else FIFO: no tearing). On a display that is not 60 / 120 / 240 Hz some frames stay on screen
;            one refresh longer than others: that cannot be avoided there.
;   off:     immediate presentation as soon as a frame is ready, tearing allowed. Lowest latency. Still 60 frames per second.
;   on:      the swapchain's own vertical sync (FIFO) next to the program's clock: two clocks, not recommended. (auto,
;            display and clock use FIFO too on a GPU without mailbox, e.g. AMD on Windows.)
;   mailbox: as clock; FIFO when the GPU has no mailbox.
vsync = auto

; latency = normal | low | lowest      (track L1, input latency; Vulkan)
;   normal:  the game is let go at the tick. (The game's picture is shown one frame sooner than before 2026-10-14 in
;            every mode: it goes to the window as soon as the game has submitted it.)
;   low:     the game is let go late in each frame, just in time for its picture to be ready for the next tick, so it
;            reads the controller 2-5 ms later = closer to the screen. Same cadence; with four players a few more late frames.
;   lowest:  as low, and the picture goes to the window as soon as it is ready (no wait for the tick): about 4 ms
;            less again, but the frames are no longer all on screen for the same time (judder).
latency = normal

; runahead = off | on      (track R1, input latency; Vulkan; needs the build with dirty-page marks)
;   on: in a fight each frame's picture is drawn one game frame earlier: the state is saved after the game's
;       submission, the next frame is run ahead only to draw the current one, then the state is restored. One frame
;       less delay; costs a second pass of the game's frame (CPU) every frame. Leave it off on a weak PC.
runahead = off

; gpu = auto | <number> | <part of the name>      (Vulkan)
;   auto: a discrete GPU first, then an integrated one. The log lists the devices with their numbers:
;   'nvn_vk: device 0: ...'. Examples: gpu = 1      gpu = Intel      gpu = RTX
gpu = auto

; console_mode = docked | handheld
;   What nn::oe::GetOperationMode answers. MEASURED on 13.0.4 (2026-10-09): with handheld the game still makes its
;   1920x1080 window texture, so this alone does not lower the render size; kept for study, leave it at docked.
console_mode = docked

; resolution_scale = 1.0
;   Internal resolution scale, 0.25 to 3.0 (Vulkan only; OpenGL ignores it). 1.0 = the game's own size: Bayonetta 2
;   renders at 1280x720. 1.5 = 1920x1080, 2.0 = 2560x1440, 3.0 = 3840x2160 (4K) (drawn larger, reduced to the window:
;   sharper edges). [Recomps#1] Works since finding 83 (the 3D scene was missing above 1.0). Measured in the first
;   tutorial fight on an RTX 5070 (2026-10-16/17): GPU time per frame 1.68 ms at 1.0, 1.96 ms at 1.5, 2.32 ms at 2.0;
;   59.3-59.5 fps up to 3.0; 2.0 takes about 300 MB more video memory, 3.0 about 640 MB (strong GPUs only, finding 105).
;   Below 1.0 not tested on Bayonetta 2.
resolution_scale = 2.0

; anisotropic_filtering = game | 2 | 4 | 8 | 16      (Vulkan)
;   game: each texture sampler keeps the value the game gave it. A number: at least that much on every sampler that
;   filters between mip levels (sharper textures at flat angles; changes the picture, costs little on any GPU).
anisotropic_filtering = 8

; shader_wait = hold | skip      (Vulkan)
;   What happens when a draw needs a shader or pipeline that is not ready yet (mostly the first time something is shown
;   on this PC). hold: the frame waits for it (a late frame, a correct picture). skip: in and around a fight the draw is
;   left out until it is ready (no late frame; the object or effect is missing for some frames). The log counts both.
shader_wait = hold

; shader_prepare = first_run | background | off      (Vulkan)
;   No effect in B2recomp ([Recomps#1]): preparing every shader ahead reads Smash's data.arc, which Bayonetta 2 does not
;   have. Shaders and pipelines are made the first time the game needs them and kept in ..\cache\vk, so later starts
;   reuse them (delete that folder to start over, e.g. after a new graphics driver).
shader_prepare = first_run

; profile = custom | low
;   custom: every key of this file as written. low: the set measured for a weak or integrated GPU (2026-10-12, Intel
;   integrated: 4.2 ms of GPU time per fight frame instead of 9.0): resolution_scale = 0.5, anisotropic_filtering = game,
;   vsync = clock; those three keys of the file are then not used. The log says which profile is active.
profile = custom

; aspect = keep | stretch      (Vulkan)
;   [Recomps#1] keep: the game's 16:9 picture keeps its shape; a wider or taller window (an ultrawide monitor in
;   borderless or fullscreen mode) gets black bars at the sides or at the top and bottom. stretch: the picture fills
;   the window whatever its shape.
aspect = keep

; frame_time_overlay = off | on
;   on: the average frame time of the last second in the window title ('.. fps - 16.67 ms per frame') and as a
;   'frame-time:' line in the log. (Bars drawn into the picture are not implemented yet.)
frame_time_overlay = off

; frame_rate = 60      (60 .. 120; EXPERIMENTAL above 60)
;   60: the game as made (60 frames per second, its own 30 fps cinematics). 61 .. 120: the game's frame clock measures
;   real time and the frame rate is capped at this value; its timers that count frames are converted to game time
;   (scripts/fps_patch.py, notes/fps-research.md). Not every frame counter is converted yet: some effects, menus and
;   button-mash prompts may run faster than at 60, and the cinematics run in real time. vsync = clock / display /
;   auto still show each frame at once above 60 (no tearing: mailbox, else FIFO, which shows at most one frame per refresh).
frame_rate = 60
